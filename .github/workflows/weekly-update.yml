name: Schedule update

# Keeps the record, results and kickoff times current with nobody touching the repo.
# Reads ESPN's public schedule feed, edits src/lib/saturday/schedule.ts only when
# something changed, proves the site still builds, then commits to main. Vercel
# deploys on the push. A failed run changes nothing and emails the repo owner.

on:
  schedule:
    - cron: "0 10 * * *" # daily, 10:00 UTC: after Saturday night games have gone final
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: schedule-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test the updater against its fixtures
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Update schedule.ts from the feed
        id: update
        run: PYTHONDONTWRITEBYTECODE=1 python3 scripts/auto_update.py

      - uses: actions/setup-node@v4
        if: steps.update.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: npm

      - name: Prove the site still builds
        if: steps.update.outputs.changed == 'true'
        run: |
          npm ci
          npm run test:site
          npm run build

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          # Vercel only deploys commits from an author it recognises, so the
          # commit carries the owner's identity and the "content:" prefix.
          git config user.name "Ryan Welker"
          git config user.email "ryan@watauga.co"
          git add src/lib/saturday/schedule.ts
          git commit -m "content: ${SUMMARY}"
          git push

      - name: Keep this schedule alive
        # GitHub switches off scheduled workflows after 60 days without repo
        # activity, which would happen every off-season. Re-enabling resets the clock.
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/weekly-update.yml/enable"
